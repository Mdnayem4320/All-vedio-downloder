<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<title>All Video Downloader</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <header>
    <h1>All Video Downloader</h1>
    <p>Low to 1080p, free and private</p>
  </header>

  <section class="glass" id="pinCard" hidden>
    <label for="pin">Access PIN</label>
    <div class="row">
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Enter your PIN">
      <button id="savePin" class="btn">Unlock</button>
    </div>
  </section>

  <section class="glass">
    <label for="url">Video link</label>
    <div class="row">
      <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="Paste a YouTube, Facebook, TikTok link…">
      <button id="paste" class="btn alt" type="button">Paste</button>
    </div>
    <button id="go" class="btn wide" type="button">Get video</button>
    <p id="status" role="status"></p>
  </section>

  <section class="glass" id="result" hidden>
    <div class="info">
      <img id="thumb" alt="" referrerpolicy="no-referrer">
      <div><h2 id="title"></h2><p id="meta"></p></div>
    </div>
    <div class="grid" id="quals"></div>
    <button id="audio" class="btn alt wide" type="button">Audio only (MP3)</button>
    <div class="bar" id="bar" hidden><b id="fill"></b></div>
    <p id="prog" role="status"></p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
